name: Release

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

env:
  ARTIFACT_GLOB: build/libs/AntiPopup-*.jar

jobs:
  pre-release:
    name: Build pre-release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build artifacts
        run: ./gradlew build

      - name: Set release tag
        id: release-vars
        run: echo "tag=pre-release-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiPopup-${{ steps.release-vars.outputs.tag }}
          path: ${{ env.ARTIFACT_GLOB }}
          if-no-files-found: error

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pre-release ${{ steps.release-vars.outputs.tag }}
          prerelease: true
          files: ${{ env.ARTIFACT_GLOB }}

  release:
    name: Build release assets
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build artifacts
        run: ./gradlew build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiPopup-${{ github.event.release.tag_name }}
          path: ${{ env.ARTIFACT_GLOB }}
          if-no-files-found: error

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ARTIFACT_GLOB }}
